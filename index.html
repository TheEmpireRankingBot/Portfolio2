<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta name="theme-color" content="#02040C"/>
  <title>GlobeTrip — Discover the World</title>
  <meta name="description" content="A premium travel discovery app. Spin a 3D globe, tap any of 25 popular cities, and unlock real-feeling hotel, activity, and flight options."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #02040C; overflow: hidden; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    @media (min-width: 500px) {
      body { display: flex; align-items: center; justify-content: center; background: #000; }
      #root { width: 390px; height: 844px; border-radius: 44px; box-shadow: 0 40px 120px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08); }
    }
    @keyframes pulse { 0% { transform:scale(1); opacity:0.85; } 70% { transform:scale(1.6); opacity:0; } 100% { transform:scale(1.6); opacity:0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
    @keyframes revealIn { 0% { opacity:0; transform:scale(0.85) translateY(10px); filter:blur(8px); } 60% { opacity:1; filter:blur(0); } 100% { opacity:1; transform:scale(1) translateY(0); filter:blur(0); } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes tooltipIn { 0% { opacity: 0; transform: translate(-50%, -100%) translateY(8px); } 100% { opacity: 1; transform: translate(-50%, -100%); } }
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="database.js"></script>
<script type="text/babel" src="globe.js"></script>
<script type="text/babel" src="screens.js"></script>
<script type="text/babel" src="app.js"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.GlobeTripApp/>
  );
</script>
</body>
</html>
