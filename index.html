<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta name="theme-color" content="#02040C"/>
  <title>Driftly — Go Somewhere</title>
  <meta name="description" content="Spin a 3D globe and discover your next trip. Real flights, hotels and 3-day itineraries for 25 destinations."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #02040C; overflow: hidden; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    @media (min-width: 500px) {
      body { display: flex; align-items: center; justify-content: center; background: #000; }
      #root { width: 390px; height: 844px; border-radius: 44px; box-shadow: 0 40px 120px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.07); }
    }

    /* ── Loading Screen ───────────────────────────────── */
    #ls {
      position: fixed; inset: 0; z-index: 9999;
      background: #02040C;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    #ls.hide { opacity: 0; pointer-events: none; transform: scale(1.04); }

    .ls-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #F8E2B4 0%, #C99040 100%);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 40px rgba(244,217,166,0.35);
      margin-bottom: 20px;
      animation: lsFloat 2.5s ease-in-out infinite;
    }
    .ls-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 54px; font-weight: 500;
      color: #fff; letter-spacing: -2px; line-height: 1;
    }
    .ls-sub {
      font-family: 'Inter Tight', system-ui, sans-serif;
      font-size: 11px; letter-spacing: 3.5px; text-transform: uppercase;
      color: rgba(244,217,166,0.7);
      margin-top: 10px;
    }
    .ls-track {
      width: 72px; height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: 44px;
      overflow: hidden;
    }
    .ls-bar {
      height: 100%;
      background: linear-gradient(90deg, #F4D9A6, #E5BD7A);
      border-radius: 2px;
      animation: lsFill 2.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes lsFloat {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50%       { transform: translateY(-10px) rotate(4deg); }
    }
    @keyframes lsFill { from { width: 0; } to { width: 100%; } }

    /* ── App-level animation keyframes ───────────────── */
    @keyframes pulse    { 0%    { transform:scale(1); opacity:0.85; }
                          70%   { transform:scale(1.6); opacity:0; }
                          100%  { transform:scale(1.6); opacity:0; } }
    @keyframes spin     { to    { transform: rotate(360deg); } }
    @keyframes twinkle  { 0%,100% { opacity:0.15; } 50% { opacity:0.85; } }
    @keyframes revealIn { 0%    { opacity:0; transform:scale(0.85) translateY(10px); filter:blur(8px); }
                          60%   { opacity:1; filter:blur(0); }
                          100%  { opacity:1; transform:scale(1) translateY(0); filter:blur(0); } }
    @keyframes fadeIn   { from  { opacity:0; } to { opacity:1; } }
    @keyframes slideUp  { from  { opacity:0; transform:translateY(16px); }
                          to    { opacity:1; transform:translateY(0); } }
    @keyframes tooltipIn{ 0%    { opacity:0; transform:translate(-50%,-100%) translateY(8px); }
                          100%  { opacity:1; transform:translate(-50%,-100%); } }

    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div id="ls">
  <div class="ls-icon">✈</div>
  <div class="ls-name">driftly</div>
  <div class="ls-sub">your next somewhere</div>
  <div class="ls-track"><div class="ls-bar"></div></div>
</div>

<div id="root"></div>

<script>
  (function () {
    function dismissLS() {
      var el = document.getElementById('ls');
      if (!el || el._gone) return;
      el._gone = true;
      el.classList.add('hide');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
    }
    window._driftlyReady = dismissLS;
    setTimeout(dismissLS, 4500); // hard fallback
  })();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="database.js"></script>
<script type="text/babel" src="globe.js"></script>
<script type="text/babel" src="screens.js"></script>
<script type="text/babel" src="app.js"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.GlobeTripApp/>
  );
</script>
</body>
</html>
